name: Custodian
description: >-
  Custodian (getcustodian.com) is a Mexico City-based consumer mobile application and
  insurtech service that centralizes vehicle documentation and automotive administrative
  tasks. The app helps drivers organize and store important paperwork, track expiration
  dates for registration, insurance policies, and health certificates, receive renewal
  notifications, and get assistance with auto-insurance renewals and claims management.
  A premium annual subscription (450 MXN) adds full document-handling and verification
  services (including Mexico City vehicle verification). Custodian is a consumer app
  distributed via the Apple App Store and Google Play; it does not publish a public
  developer API, developer portal, or OpenAPI at this time. Backed by 500 Global.
